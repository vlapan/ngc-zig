name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-freebsd
          - aarch64-freebsd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Build Release
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstamp=true
          mv zig-out/bin/ngc zig-out/bin/ngc-${{ matrix.target }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: zig-out/bin/ngc-${{ matrix.target }}
          fail_on_unmatched_files: true
