worker_processes 1;
daemon off;
pid nginx-full.pid;
error_log error-full.log;

events {
    worker_connections 16;
}

http {
    geo $arg_ip $country {
        default US;
        include ../output.txt;
    }

    server {
        listen 8888;
        server_name localhost;
        location / {
            return 200 "ip=$arg_ip country=$country\n";
            add_header Content-Type text/plain;
        }
    }
}
